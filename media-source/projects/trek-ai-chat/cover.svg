<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Assistant chat workspace</title>
  <desc id="desc">A dark trip planning chat with a left conversation sidebar, assistant messages, a place proposal, and a context meter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#171921"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252832"/>
      <stop offset="1" stop-color="#20232b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1370" cy="100" r="330" fill="#8067ff" opacity=".06"/>
  <circle cx="260" cy="830" r="360" fill="#41b8a0" opacity=".045"/>
  <g filter="url(#shadow)">
    <rect x="105" y="72" width="1390" height="756" rx="22" fill="#16181e" stroke="#32353f"/>
    <path d="M387 72v756" stroke="#32353f"/>
    <path d="M387 148h1108" stroke="#32353f"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="105" y="72" width="282" height="756" rx="22" fill="#1b1d24"/>
    <rect x="105" y="126" width="282" height="22" fill="#1b1d24"/>
    <rect x="105" y="806" width="282" height="22" fill="#1b1d24"/>
    <rect x="132" y="100" width="38" height="38" rx="11" fill="#2b2939" stroke="#625a8e"/>
    <path d="M144 116h14v11h-14zm7-7v7m-11 5h4m14 0h4" fill="none" stroke="#9d8dff" stroke-width="2" stroke-linecap="round"/>
    <text x="183" y="116" fill="#f1f1f4" font-family="Georgia, serif" font-size="21">Assistant</text>
    <text x="183" y="134" fill="#8d909a" font-size="11">Trip conversations</text>

    <rect x="132" y="163" width="110" height="34" rx="9" fill="#252831" stroke="#3b3e48"/>
    <text x="154" y="184" fill="#d7d8dc" font-size="12">Private</text>
    <rect x="249" y="163" width="110" height="34" rx="9" fill="#252831" stroke="#3b3e48"/>
    <text x="270" y="184" fill="#d7d8dc" font-size="12">Shared</text>
    <text x="132" y="235" fill="#777b86" font-size="10" font-weight="700" letter-spacing="2">CHATS</text>

    <rect x="121" y="253" width="250" height="58" rx="12" fill="#272a33" stroke="#41444e"/>
    <text x="138" y="276" fill="#f0f0f3" font-size="13" font-weight="600">Ramen near the apartment</text>
    <text x="138" y="295" fill="#818590" font-size="10">Private · now</text>
    <path d="M345 275v-4a5 5 0 0 0-10 0v4m-2 0h14v11h-14z" fill="none" stroke="#858995" stroke-width="1.5"/>

    <rect x="121" y="318" width="250" height="58" rx="12" fill="transparent"/>
    <text x="138" y="341" fill="#d4d5d9" font-size="13" font-weight="600">Ideas for day three</text>
    <text x="138" y="360" fill="#777b86" font-size="10">Sam · shared · 14m</text>
    <circle cx="341" cy="341" r="5" fill="none" stroke="#858995" stroke-width="1.5"/>
    <circle cx="350" cy="341" r="5" fill="none" stroke="#858995" stroke-width="1.5"/>

    <rect x="121" y="383" width="250" height="58" rx="12" fill="transparent"/>
    <text x="138" y="406" fill="#d4d5d9" font-size="13" font-weight="600">Rainy afternoon backup</text>
    <text x="138" y="425" fill="#777b86" font-size="10">Private · 2d</text>

    <text x="132" y="782" fill="#737782" font-size="10">Shared chats belong to the trip.</text>
    <text x="132" y="798" fill="#737782" font-size="10">Visibility is fixed when created.</text>

    <text x="430" y="111" fill="#f3f3f5" font-family="Georgia, serif" font-size="21">Ramen near the apartment</text>
    <text x="430" y="132" fill="#858995" font-size="11">Private to you</text>
    <path d="M1442 107h18m-14-8v-4h10v4m-12 0 2 19h10l2-19" fill="none" stroke="#858995" stroke-width="1.6"/>

    <circle cx="460" cy="207" r="18" fill="#292c35"/>
    <text x="451" y="212" fill="#cfd0d5" font-size="10" font-weight="700">AL</text>
    <text x="491" y="195" fill="#8c909a" font-size="11" font-weight="600">Alex</text>
    <text x="491" y="220" fill="#f0f0f3" font-size="15">Find a great ramen spot near our apartment and add it to day 3.</text>

    <rect x="442" y="273" width="36" height="36" rx="11" fill="#292738" stroke="#5e5688"/>
    <path d="M451 287h18v13h-18zm9-7v7m-13 6h4m18 0h4" fill="none" stroke="#9c8cff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="491" y="284" fill="#8c909a" font-size="11" font-weight="600">Assistant</text>
    <text x="491" y="311" fill="#d6d7db" font-size="14">I found a well-rated option about 700 m from the Shinjuku apartment.</text>
    <text x="491" y="335" fill="#d6d7db" font-size="14">Review the trip change below before applying it.</text>

    <rect x="491" y="362" width="705" height="181" rx="16" fill="url(#card)" stroke="#5d5684"/>
    <text x="515" y="392" fill="#888c96" font-size="10" font-weight="700" letter-spacing="1.7">TRIP CHANGE</text>
    <text x="515" y="423" fill="#f0f0f3" font-size="17" font-weight="650">Add Menya Musashi to Museums</text>
    <text x="515" y="450" fill="#a4a7af" font-size="12">7-2-6 Nishishinjuku, Shinjuku City · 4.4 ★ · 0.7 km away</text>
    <rect x="1086" y="382" width="82" height="25" rx="13" fill="#30333c"/>
    <text x="1104" y="399" fill="#a9abb2" font-size="10">pending</text>
    <rect x="515" y="482" width="83" height="37" rx="10" fill="#8b78ff"/>
    <text x="539" y="506" fill="#fff" font-size="12" font-weight="650">Apply</text>
    <rect x="607" y="482" width="87" height="37" rx="10" fill="transparent"/>
    <text x="626" y="506" fill="#aaaeb7" font-size="12">Dismiss</text>

    <text x="430" y="690" fill="#888c96" font-size="11">3.2% context · 32 thousand / 1.05 million tokens · $0.01</text>
    <text x="1190" y="690" fill="#888c96" font-size="11">New chat required at 20%</text>
    <rect x="430" y="710" width="1018" height="79" rx="17" fill="#20232a" stroke="#3d404a"/>
    <text x="452" y="744" fill="#777b86" font-size="14">Ask about this trip...</text>
    <rect x="1393" y="739" width="38" height="38" rx="11" fill="#8b78ff"/>
    <path d="m1404 758 17-9-5 18-4-7-8-2zm8 2 9-11" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
